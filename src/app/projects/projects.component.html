<div class="container mx-auto grid grid-cols-2  lg:grid-cols-4 gap-4 p-4 px-10 xl:px-32 pb-20 content h-full">
    @for (project of projects; track $index) {
    <div
        class="bg-white row-span-2 md:row-span-1 col-span-2 dark:bg-gray-800 rounded-[30px] p-6 flex flex-col gap-4 h-[400px]  md:h-[300px] hover:shadow-lg dark:hover:shadow-xl hover-trigger relative">
        <div class="grid grid-cols-4 sm:mb-4">
            <!-- image -->
            <div class="md:col-span-2 col-span-4">
                <img class="w-full h-[100px] md:h-full object-contain rounded-lg p-2" [src]="project.image"
                    alt="project name">
            </div>

            <div class="md:col-span-2 col-span-4">

                <!-- titlle -->
                <h5 class="md:mb-2 text-xl font-bold font-mono text-gray-900 dark:text-white p-2">{{project.name}}</h5>

                <!-- description -->
                <p class="font-sans text-gray-700 dark:text-gray-300 text-xs md:text-sm p-2 mb-6">{{project.description}}</p>

                <div class="flex gap-5 md:ml-5">
                    <!-- techs -->
                    @for (tech of project.tech; track $index) {
                    <div class="w-7 h-7 flex items-center justify-center inset-x-0 top-0 relative group">
                        <img class="w-full h-full object-contain" [src]="tech.image" alt="tech">
                    
                        <!-- Tooltip -->
                        <div
                            class="tooltip hidden group-hover:block absolute bottom-full mb-2 left-1/2 transform -translate-x-1/2 bg-gray-700 text-white text-xs font-semibold py-1 px-2 rounded">
                            {{ tech.name }}
                        </div>
                    </div>
                    }
                    <!-- <p class="text-gray-500 text-sm inset-x-0">more..</p> -->
                </div>

            </div>
        </div>


        <div class="flex gap-x-5 md:gap-x-8">
            <!-- website -->
            @if (project.view != false) {
            <a href="https://codepen.io/thisNiharika/pens/public" target="_blank">
            <button
                class="rounded-full bg-white dark:bg-gray-800 relative flex hover:ring-4 ring-gray-200 p-2 px-3 border-2 border-gray-200 dark:border-gray-400 dark:text-white dark:ring-gray-400 hover:transition duration-700 ease-in-out">
                <svg id="Arrow.7" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 18.256 18.256"
                    style="transition:.3s">
                    <g id="Group_7" data-name="Group 7" transform="translate(5.363 5.325)">
                        <path id="Path_10" data-name="Path 10" d="M14.581,7.05,7.05,14.581"
                            transform="translate(-7.05 -7.012)" fill="none" stroke="#0D1117" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="1.5"></path>
                        <path id="Path_11" data-name="Path 11" d="M10,7l5.287.037.038,5.287"
                            transform="translate(-7.756 -7)" fill="none" stroke="#0D1117" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="1.5"></path>
                    </g>
                    <path id="Path_12" data-name="Path 12" d="M0,0H18.256V18.256H0Z" fill="none"></path>
                </svg>
                Protects
            </button>
        </a>
            }
            <!-- git hub -->
            @if (project.github != false) {
             <a href="https://codepen.io/thisNiharika/pens/public" target="_blank">
            <button
                class="rounded-full bg-white dark:bg-gray-800 relative flex hover:ring-4 ring-gray-200 p-2 px-3 border-2 border-gray-200 dark:border-gray-400 dark:text-white dark:ring-gray-400 hover:transition duration-700 ease-in-out">
                <svg id="Arrow.7" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 18.256 18.256"
                    style="transition:.3s">
                    <g id="Group_7" data-name="Group 7" transform="translate(5.363 5.325)">
                        <path id="Path_10" data-name="Path 10" d="M14.581,7.05,7.05,14.581"
                            transform="translate(-7.05 -7.012)" fill="none" stroke="#0D1117" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="1.5"></path>
                        <path id="Path_11" data-name="Path 11" d="M10,7l5.287.037.038,5.287"
                            transform="translate(-7.756 -7)" fill="none" stroke="#0D1117" stroke-linecap="round"
                            stroke-linejoin="round" stroke-width="1.5"></path>
                    </g>
                    <path id="Path_12" data-name="Path 12" d="M0,0H18.256V18.256H0Z" fill="none"></path>
                </svg>
               Protects
            </button>
        </a>
            }
          
           

        </div>
    </div>
    }

</div>
